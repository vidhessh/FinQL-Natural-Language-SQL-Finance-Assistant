<style>

    --paper-dim:#f1eee2;

    display:flex;
    justify-content:center;
    padding: 28px 16px 40px;
  }
  .app{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    min-height: calc(100vh - 68px);
  }

  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 4px 6px 18px;
    border-bottom: 1px dashed rgba(250,248,241,0.25);
    margin-bottom: 18px;

    font-weight:700;

  }

  .masthead .tag{

    color: rgba(250,248,241,0.55);
    font-style: italic;
  }

  /* ---------- Stat strip ---------- */
  .stat-strip{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }

    background: var(--ink-soft);
    border: 1px solid rgba(250,248,241,0.12);
    border-radius: 10px;
    padding: 12px 10px 10px;
    position: relative;
    overflow: hidden;
  }
  .stub::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height: 3px;
    background: repeating-linear-gradient(90deg, rgba(250,248,241,0.35) 0 6px, transparent 6px 12px);
  }
  .stub .label{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(250,248,241,0.5);
    margin-bottom: 6px;
  }
  .stub .value{

    font-weight: 700;
    font-size: 17px;
    line-height:1.15;

  .stub .value.neg{ color:#f0958a; }
  .stub .sub{
    font-size: 10px;
    color: rgba(250,248,241,0.45);

    font-size: 14.5px;

    padding: 16px 16px 14px;
    clip-path: polygon(
      0% 8px, 3% 0%, 6% 8px, 9% 0%, 12% 8px, 15% 0%, 18% 8px, 21% 0%, 24% 8px, 27% 0%,

  @media (max-width:520px){
    .stat-strip{ grid-template-columns: repeat(2,1fr); }
    .bubble-user, .receipt{ max-width: 92%; }
  }

<script>

const GROQ_API_KEY = "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";

/* =========================================================================
   1. SEEDED SAMPLE TRANSACTIONS

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(42);
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const randInt = (min, max) => Math.floor(rng() * (max - min + 1)) + min;
const randAmt = (min, max) => Math.round((rng() * (max - min) + min) * 100) / 100;

const MERCHANTS = {
  Dining: ["Bluebird Cafe","Ramen Doraku","Corner Bistro","Taco Fiesta","Green Leaf Sushi","Morning Brew Coffee"],
  Groceries: ["Trader Joe's","Whole Foods","Local Farmers Market","Costco Wholesale"],
  Rent: ["Maple Street Apartments"],
  Utilities: ["CityPower & Light","AquaWorks Water","Comcast Internet"],
  Transport: ["Metro Transit","Shell Gas Station","Uber","Lyft"],
  Entertainment: ["Cinemax Theaters","Steam Games","Downtown Concert Hall","Bowling Alley"],
  Shopping: ["Amazon","Target","Nike Store","IKEA"],
  Health: ["CVS Pharmacy","City Fitness Gym","Dental Care Clinic"],
  Subscriptions: ["Netflix","iCloud Storage","NYT Digital","Spotify"],
  Travel: ["Delta Airlines","Marriott Hotels","Airbnb"],
  Income: ["Acme Corp Payroll","Freelance Client","Interest Income"]
};

function monthsBack(n){
  const out = [];
  const now = new Date(2026, 6, 2); // Jul 2, 2026 reference point so June is "last month"
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push({ y: d.getFullYear(), m: d.getMonth() });
  }
  return out;
}

function genTransactions(){
  const rows = [];
  let id = 1;
  const months = monthsBack(5); // 5 months of history

  const addRow = (y, m, day, category, merchant, amount, type) => {
    const dd = String(Math.min(day,28)).padStart(2,"0");
    const mm = String(m+1).padStart(2,"0");
    rows.push({ id: id++, date: `${y}-${mm}-${dd}`, category, merchant, amount, type });
  };

  months.forEach(({y,m}) => {
    // Income: two payroll deposits
    addRow(y,m,1,"Income", pick(MERCHANTS.Income), randAmt(3050,3300), "income");
    addRow(y,m,15,"Income", "Acme Corp Payroll", randAmt(3050,3300), "income");
    if(rng() > 0.6) addRow(y,m,randInt(3,26),"Income", "Freelance Client", randAmt(150,650), "income");

    // Rent
    addRow(y,m,1,"Rent","Maple Street Apartments", 1450, "expense");

    // Utilities
    ["CityPower & Light","AquaWorks Water","Comcast Internet"].forEach(mer=>{

    // Groceries

    for(let i=0;i<groceryCount;i++) addRow(y,m,randInt(1,28),"Groceries", pick(MERCHANTS.Groceries), randAmt(18,115), "expense");

    // Dining
    const diningCount = randInt(7,13);
    for(let i=0;i<diningCount;i++) addRow(y,m,randInt(1,28),"Dining", pick(MERCHANTS.Dining), randAmt(7,68), "expense");

    // Transport
    const transportCount = randInt(4,8);
    for(let i=0;i<transportCount;i++) addRow(y,m,randInt(1,28),"Transport", pick(MERCHANTS.Transport), randAmt(9,65), "expense");

    // Entertainment
    const entCount = randInt(2,5);
    for(let i=0;i<entCount;i++) addRow(y,m,randInt(1,28),"Entertainment", pick(MERCHANTS.Entertainment), randAmt(12,90), "expense");

    // Shopping
    const shopCount = randInt(3,6);
    for(let i=0;i<shopCount;i++) addRow(y,m,randInt(1,28),"Shopping", pick(MERCHANTS.Shopping), randAmt(15,220), "expense");

    // Health
    const healthCount = randInt(1,3);
    for(let i=0;i<healthCount;i++) addRow(y,m,randInt(1,28),"Health", pick(MERCHANTS.Health), randAmt(20,140), "expense");

    // Subscriptions (fixed recurring)
    [["Netflix",15.49],["iCloud Storage",2.99],["NYT Digital",17],["Spotify",11.99]].forEach(([mer,amt])=>{
      addRow(y,m,randInt(1,10),"Subscriptions", mer, amt, "expense");
    });

    // Travel (occasional)
    if(rng() > 0.65){
      const mer = pick(MERCHANTS.Travel);
      addRow(y,m,randInt(1,28),"Travel", mer, randAmt(120,780), "expense");
    }
  });

  return rows.sort((a,b)=> a.date.localeCompare(b.date));
}

const TRANSACTIONS = genTransactions();
const SCHEMA_DESC = `Table: transactions
Columns:
  id       INTEGER
  date     TEXT   (format 'YYYY-MM-DD')
  category TEXT   (one of: Dining, Groceries, Rent, Utilities, Transport, Entertainment, Shopping, Health, Subscriptions, Travel, Income)
  merchant TEXT
  amount   REAL   (always positive)
  type     TEXT   ('income' or 'expense')`;

/* =========================================================================
   2. HAND-WRITTEN SQL ENGINE
   Supports: SELECT (cols, *, SUM/COUNT/AVG/MIN/MAX with optional AS alias)
             FROM transactions
             WHERE  col OP value [AND|OR col OP value ...]   (no parentheses, left-to-right)
             GROUP BY col[, col...]
             ORDER BY col [ASC|DESC]
             LIMIT n
   Single table only. No joins, no subqueries.
   ========================================================================= */
function splitTopLevel(str, delimRegex){
  // split on delimiter, ignoring content inside parentheses or quotes
  const parts = [];
  let depth = 0, inQuote = null, cur = "";
  for(let i=0;i<str.length;i++){
    const c = str[i];
    if(inQuote){
      cur += c;
      if(c === inQuote) inQuote = null;
      continue;
    }
    if(c === "'" || c === '"'){ inQuote = c; cur += c; continue; }
    if(c === "(") depth++;
    if(c === ")") depth--;
    if(depth === 0){
      const rest = str.slice(i);
      const m = rest.match(delimRegex);
      if(m && m.index === 0){
        parts.push(cur.trim());
        cur = "";
        i += m[0].length - 1;
        continue;
      }
    }
    cur += c;
  }
  if(cur.trim() !== "") parts.push(cur.trim());
  return parts;
}

function parseSQL(sql){
  const clean = sql.trim().replace(/;+\s*$/,"");
  const re = /^SELECT\s+(.+?)\s+FROM\s+(\w+)(?:\s+WHERE\s+(.+?))?(?:\s+GROUP\s+BY\s+(.+?))?(?:\s+ORDER\s+BY\s+(.+?))?(?:\s+LIMIT\s+(\d+))?\s*$/is;
  const m = clean.match(re);
  if(!m) throw new Error("Could not parse SQL — only a single-table SELECT ... FROM ... [WHERE] [GROUP BY] [ORDER BY] [LIMIT] is supported.");
  const [, selectPart, table, wherePart, groupPart, orderPart, limitPart] = m;
  if(table.toLowerCase() !== "transactions") throw new Error(`Unknown table "${table}" — only "transactions" exists.`);

  // SELECT list
  const selectItems = splitTopLevel(selectPart, /^,\s*/).map(item=>{
    const aggMatch = item.match(/^(SUM|COUNT|AVG|MIN|MAX)\s*\(\s*(\*|[\w.]+)\s*\)(?:\s+AS\s+(\w+))?$/i);
    if(aggMatch){
      const [, fn, arg, alias] = aggMatch;
      const key = alias || `${fn.toUpperCase()}(${arg})`;
      return { type:"agg", fn: fn.toUpperCase(), arg, key };
    }
    const colMatch = item.match(/^(\*|[\w.]+)(?:\s+AS\s+(\w+))?$/i);
    if(colMatch){
      const [, col, alias] = colMatch;
      return { type:"col", col, key: alias || col };
    }
    throw new Error(`Could not understand SELECT item "${item}".`);
  });

  // WHERE
  let where = null;
  if(wherePart){
    const tokens = splitTopLevel(wherePart, /^\s+(AND|OR)\s+/i);
    // splitTopLevel drops the delimiter text; re-derive connectors via regex scan instead
    const conds = [];
    const condRe = /(\w+)\s*(>=|<=|!=|<>|=|>|<|LIKE)\s*('[^']*'|"[^"]*"|-?\d+(?:\.\d+)?)/i;
    const connRe = /\s+(AND|OR)\s+/ig;
    let rest = wherePart.trim();
    let connectors = [];
    let m2;
    const pieces = [];
    let lastIndex = 0;
    while((m2 = connRe.exec(rest)) !== null){
      pieces.push(rest.slice(lastIndex, m2.index));
      connectors.push(m2[1].toUpperCase());
      lastIndex = connRe.lastIndex;
    }
    pieces.push(rest.slice(lastIndex));
    pieces.forEach(piece=>{
      const cm = piece.trim().match(condRe);
      if(!cm) throw new Error(`Could not understand WHERE condition "${piece.trim()}".`);
      let [, col, op, rawVal] = cm;
      op = op.toUpperCase();
      let val;
      if(/^'.*'$/.test(rawVal) || /^".*"$/.test(rawVal)) val = rawVal.slice(1,-1);
      else val = parseFloat(rawVal);
      conds.push({ col, op, val });
    });
    where = { conds, connectors };
  }

  const groupBy = groupPart ? splitTopLevel(groupPart, /^,\s*/) : null;
  let orderBy = null;
  if(orderPart){
    const om = orderPart.trim().match(/^([\w().*]+|"[^"]+"|'[^']+')\s*(ASC|DESC)?$/i);
    if(om){
      let col = om[1].replace(/^['"]|['"]$/g,"");
      orderBy = { col, dir: (om[2]||"ASC").toUpperCase() };
    }
  }
  const limit = limitPart ? parseInt(limitPart,10) : null;

  return { selectItems, where, groupBy, orderBy, limit };
}

function matchCond(row, cond){
  let a = row[cond.col];
  let b = cond.val;
  if(cond.op === "LIKE"){
    const pattern = "^" + String(b).replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/%/g,".*").replace(/_/g,".") + "$";
    return new RegExp(pattern, "i").test(String(a));
  }
  if(typeof b === "number"){
    a = Number(a);
  } else {
    a = String(a).toLowerCase(); b = String(b).toLowerCase();
  }
  switch(cond.op){
    case "=": return a === b;
    case "!=": case "<>": return a !== b;
    case ">": return a > b;
    case "<": return a < b;
    case ">=": return a >= b;
    case "<=": return a <= b;
    default: throw new Error(`Unsupported operator "${cond.op}".`);
  }
}

function applyWhere(rows, where){
  if(!where) return rows;
  return rows.filter(row=>{
    let result = matchCond(row, where.conds[0]);
    for(let i=1;i<where.conds.length;i++){
      const conn = where.connectors[i-1];
      const next = matchCond(row, where.conds[i]);
      result = conn === "AND" ? (result && next) : (result || next);
    }
    return result;
  });
}

function computeAgg(fn, arg, rows){
  if(fn === "COUNT") return arg === "*" ? rows.length : rows.filter(r=>r[arg]!==undefined && r[arg]!==null).length;
  const nums = rows.map(r=>Number(r[arg])).filter(n=>!isNaN(n));
  if(nums.length === 0) return fn === "SUM" ? 0 : null;
  switch(fn){
    case "SUM": return Math.round(nums.reduce((a,b)=>a+b,0)*100)/100;
    case "AVG": return Math.round((nums.reduce((a,b)=>a+b,0)/nums.length)*100)/100;
    case "MIN": return Math.min(...nums);
    case "MAX": return Math.max(...nums);
  }
}

function runSQL(sql, table){
  const q = parseSQL(sql);
  let rows = applyWhere(table, q.where);
  let outRows = [];
  let outCols = [];

  const hasAgg = q.selectItems.some(i=>i.type==="agg");

  if(q.groupBy && q.groupBy.length){
    const groups = new Map();
    rows.forEach(row=>{
      const key = q.groupBy.map(g=>row[g]).join("|||");
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(row);
    });
    outRows = Array.from(groups.values()).map(groupRows=>{
      const outRow = {};
      q.selectItems.forEach(item=>{
        if(item.type === "col") outRow[item.key] = groupRows[0][item.col];
        else outRow[item.key] = computeAgg(item.fn, item.arg, groupRows);
      });
      return outRow;
    });
  } else if(hasAgg){
    const outRow = {};
    q.selectItems.forEach(item=>{
      if(item.type === "agg") outRow[item.key] = computeAgg(item.fn, item.arg, rows);
      else outRow[item.key] = rows.length ? rows[0][item.col] : null;
    });
    outRows = [outRow];
  } else {
    outRows = rows.map(row=>{
      const outRow = {};
      q.selectItems.forEach(item=>{
        if(item.col === "*"){ Object.assign(outRow, row); }
        else outRow[item.key] = row[item.col];
      });
      return outRow;
    });
  }

  outCols = q.selectItems.flatMap(item=> item.col === "*" ? ["id","date","category","merchant","amount","type"] : [item.key]);
  outCols = [...new Set(outCols)];

  if(q.orderBy){
    const { col, dir } = q.orderBy;
    outRows.sort((a,b)=>{
      let av = a[col], bv = b[col];
      if(typeof av === "number" && typeof bv === "number") return dir==="DESC" ? bv-av : av-bv;
      av = String(av); bv = String(bv);
      return dir==="DESC" ? bv.localeCompare(av) : av.localeCompare(bv);
    });
  }
  if(q.limit != null) outRows = outRows.slice(0, q.limit);

  return { columns: outCols, rows: outRows };
}

/* =========================================================================
   3. LLM CALLS (Groq)
   ========================================================================= */
async function groqChat(messages, temperature=0.1){
  let res;
  try{
    res = await fetch(GROQ_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({ model: GROQ_MODEL, temperature, max_tokens: 400, messages })
    });
  } catch(networkErr){
    // fetch() throws "Failed to fetch" for network-level failures (blocked by a
    // sandboxed preview, CORS, offline, DNS, etc) before any HTTP response exists.
    throw new Error(
      "Couldn't reach the Groq API from this browser context. If you're viewing this inside " +
      "an in-chat preview, that iframe is sandboxed and can't make outbound calls to external " +
      "APIs — download finql.html and open it directly in your browser instead. If you're " +
      "already doing that, check your browser console for a CORS or DNS error."
    );
  }
  if(!res.ok){
    const text = await res.text().catch(()=> "");
    throw new Error(`Groq API error (${res.status}): ${text.slice(0,200) || res.statusText}`);
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content?.trim() || "";
}

const SQL_SYSTEM_PROMPT = `You translate a plain-English question about personal finances into a single SQL query.

${SCHEMA_DESC}

Rules for the SQL you write — this engine is hand-written and only supports a narrow subset:
- Single table only: SELECT ... FROM transactions ...
- Allowed clauses, in this order only: SELECT, FROM, WHERE, GROUP BY, ORDER BY, LIMIT
- No JOINs, no subqueries, no parentheses anywhere (including in WHERE).
- WHERE conditions may be combined with AND / OR only, left to right, no parentheses.
- Allowed operators: =, !=, <>, >, <, >=, <=, LIKE (use % as wildcard)
- Allowed aggregate functions: SUM, COUNT, AVG, MIN, MAX — e.g. SUM(amount) AS total
- Date column is TEXT in 'YYYY-MM-DD' format — compare with string literals like '2026-06-01'. For "in June" style questions, use date >= 'YYYY-06-01' AND date <= 'YYYY-06-30'. Assume the most recent relevant year present in the data if the user doesn't specify one; today's reference date is 2026-07-02, so "last month" means June 2026.
- category values are: Dining, Groceries, Rent, Utilities, Transport, Entertainment, Shopping, Health, Subscriptions, Travel, Income
- type is 'income' or 'expense'
- Respond with ONLY the raw SQL query. No markdown fences, no explanation, no trailing semicolon needed but it's fine if present.`;

const ANSWER_SYSTEM_PROMPT = `You are FinQL, a friendly assistant that explains query results about someone's personal finances in plain English.
You will be given the user's original question, the SQL query that was run, and the JSON result rows.
Write exactly ONE short, natural sentence that directly answers the question using the real numbers from the result (format currency like $1,234.56). If the result is empty, say so plainly. Do not mention SQL or databases. Do not add caveats or extra sentences.`;

async function questionToSQL(question){
  const content = await groqChat([
    { role: "system", content: SQL_SYSTEM_PROMPT },
    { role: "user", content: question }
  ]);
  return content.replace(/^```sql\s*/i,"").replace(/^```\s*/,"").replace(/```\s*$/,"").trim();
}

async function resultToEnglish(question, sql, result){
  const trimmedRows = result.rows.slice(0, 25);
  const content = await groqChat([
    { role: "system", content: ANSWER_SYSTEM_PROMPT },
    { role: "user", content: `Question: ${question}\n\nSQL: ${sql}\n\nResult JSON: ${JSON.stringify(trimmedRows)}` }
  ], 0.2);
  return content;
}

/* =========================================================================
   4. UI RENDERING
   ========================================================================= */
const fmtCurrency = (n) => "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function renderStatStrip(){
  const income = TRANSACTIONS.filter(r=>r.type==="income").reduce((a,r)=>a+r.amount,0);
  const spend = TRANSACTIONS.filter(r=>r.type==="expense").reduce((a,r)=>a+r.amount,0);
  const net = income - spend;
  const byCat = {};
  TRANSACTIONS.filter(r=>r.type==="expense").forEach(r=> byCat[r.category] = (byCat[r.category]||0) + r.amount);
  const topCat = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];

  const stats = [
    { label:"Income (5mo)", value: fmtCurrency(income), cls:"pos" },
    { label:"Spend (5mo)", value: fmtCurrency(spend), cls:"neg" },
    { label:"Net", value: (net>=0?"+":"-")+fmtCurrency(Math.abs(net)), cls: net>=0?"pos":"neg" },
    { label:"Top Category", value: topCat[0], sub: fmtCurrency(topCat[1]) }
  ];
  document.getElementById("statStrip").innerHTML = stats.map(s=>`
    <div class="stub">
      <div class="label">${s.label}</div>
      <div class="value ${s.cls||''}">${s.value}</div>
      ${s.sub ? `<div class="sub">${s.sub}</div>` : ""}
    </div>
  `).join("");
}

const EXAMPLE_QUESTIONS = [
  "How much did I spend on dining in June?",
  "What's my top spending category?",
  "Show income vs expenses by month",
  "What did I spend at Amazon?",
  "Total spent on subscriptions"
];

function renderChips(){
  document.getElementById("chips").innerHTML = EXAMPLE_QUESTIONS.map(q=>`<div class="chip" data-q="${q.replace(/"/g,'&quot;')}">${q}</div>`).join("");
  document.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      document.getElementById("qInput").value = chip.dataset.q;
      document.getElementById("composerForm").requestSubmit();
    });
  });
}

function scrollToBottom(){
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function addUserBubble(text){
  const thread = document.getElementById("thread");
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble-user"></div>`;
  row.querySelector(".bubble-user").textContent = text;
  thread.appendChild(row);
  scrollToBottom();
}

function addLoadingReceipt(){
  const thread = document.getElementById("thread");
  const row = document.createElement("div");
  row.className = "row ai";
  row.innerHTML = `
    <div class="receipt">
      <div class="r-head">FINQL · QUERY RECEIPT</div>
      <div class="r-sub">printing…</div>
      <hr class="r-rule"/>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  thread.appendChild(row);
  scrollToBottom();
  return row;
}

function renderTable(result){
  const cols = result.columns;
  const rows = result.rows;
  const shown = rows.slice(0, 8);
  const isMoneyCol = (c) => /amount|total|sum|avg|min|max/i.test(c);
  const fmtCell = (col, val) => {
    if(val === null || val === undefined) return "—";
    if(typeof val === "number" && isMoneyCol(col)) return fmtCurrency(val);
    return String(val);
  };
  let html = `<div class="r-table-wrap"><table class="r-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`;
  shown.forEach(row=>{
    html += `<tr>${cols.map(c=>`<td>${fmtCell(c, row[c])}</td>`).join("")}</tr>`;
  });
  html += `</tbody></table></div>`;
  if(rows.length > shown.length) html += `<div class="r-more">+ ${rows.length - shown.length} more row(s) not shown</div>`;
  if(rows.length === 0) html += `<div class="r-more">No matching rows.</div>`;
  return html;
}

function fillReceipt(row, { sql, result, insight, error }){
  const now = new Date();
  const stamp = now.toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  if(error){
    row.querySelector(".receipt").innerHTML = `
      <div class="r-head">FINQL · QUERY RECEIPT</div>
      <div class="r-sub">${stamp}</div>
      <hr class="r-rule"/>
      <div class="r-error">⚠ ${error}</div>
      <div class="r-foot">— NO SALE —</div>`;
    return;
  }
  row.querySelector(".receipt").innerHTML = `
    <div class="r-head">FINQL · QUERY RECEIPT</div>
    <div class="r-sub">${stamp}</div>
    <hr class="r-rule"/>
    <div class="r-label">SQL</div>
    <div class="r-sql">${sql}</div>
    <hr class="r-rule"/>
    <div class="r-label">RESULT</div>
    ${renderTable(result)}
    <hr class="r-rule"/>
    <div class="r-insight">${insight}</div>
    <div class="r-barcode"></div>
    <div class="r-foot">THANK YOU FOR YOUR QUERY</div>`;
}

/* =========================================================================
   5. WIRE UP
   ========================================================================= */
async function handleQuestion(question){
  addUserBubble(question);
  const loadingRow = addLoadingReceipt();
  document.getElementById("sendBtn").disabled = true;

  try{
    const sql = await questionToSQL(question);
    let result;
    try{
      result = runSQL(sql, TRANSACTIONS);
    } catch(engineErr){
      fillReceipt(loadingRow, { error: `SQL engine couldn't run this query: ${engineErr.message} (Generated SQL: ${sql})` });
      return;
    }
    const insight = await resultToEnglish(question, sql, result);
    fillReceipt(loadingRow, { sql, result, insight: insight || "Here are the results above." });
  } catch(err){
    fillReceipt(loadingRow, { error: err.message || "Something went wrong talking to the model." });
  } finally {
    document.getElementById("sendBtn").disabled = false;
    scrollToBottom();
  }
}

document.getElementById("composerForm").addEventListener("submit", (e)=>{
  e.preventDefault();
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if(!q) return;
  input.value = "";
  handleQuestion(q);
});

renderStatStrip();
renderChips();
</script>
